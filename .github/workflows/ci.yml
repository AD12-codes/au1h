name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun x biome check .
      - run: bun run --filter './packages/*' build
      - run: bun run check-types
      # The portal and docs are only built by the image workflow on main otherwise;
      # a broken Vite/Next build or stale route tree should fail the PR instead.
      - run: bun run --filter './apps/web' build
      - run: bun run --filter './apps/docs' build
      # No .env in CI on purpose: unit tests must not need a database.
      - run: cd apps/server && bun --env-file=/dev/null test
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: cd packages/go && go vet ./... && go build ./...
      - uses: astral-sh/setup-uv@v6
      - run: cd packages/python && uv build

  integration:
    runs-on: ubuntu-latest
    needs: check
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: au1h
          POSTGRES_PASSWORD: au1h
          POSTGRES_DB: au1h_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U au1h"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://au1h:au1h@localhost:5432/au1h_test
      REDIS_URL: redis://localhost:6379
      BETTER_AUTH_URL: http://localhost:4444
      BETTER_AUTH_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
      CORS_ORIGIN: http://localhost:4445
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # Real Postgres + Redis, the HTTP app via app.fetch, in-memory email outbox.
      - run: cd apps/server && bun run test:integration
