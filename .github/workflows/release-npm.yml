name: Release npm packages

# Stages @au1h/client, @au1h/server and @au1h/cli (the `au1h` command) on npm with
# trusted publishing (OIDC), so no NPM_TOKEN is stored. Trigger: push a tag like
# npm-v0.1.0 whose version matches all three package.json files.
#
# The trusted publishers on npmjs.com (repository AD12-codes/au1h, workflow
# release-npm.yml) are stage-only, npm's default: this workflow stages each version
# and a maintainer makes it live with 2FA, under "Staged Packages" on npmjs.com or
# with `npm stage list` / `npm stage approve <id>`.
on:
  push:
    tags:
      - "npm-v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Staged trusted publishing needs npm >= 11.15; Node 22 ships npm 10.
      - run: npm install -g npm@latest && npm --version
      - run: bun install --frozen-lockfile
      - name: Check tag matches package versions
        run: |
          tag="${GITHUB_REF_NAME#npm-v}"
          for p in client server cli; do
            v="$(node -p "require('./packages/$p/package.json').version")"
            [ "$tag" = "$v" ] || { echo "tag $tag != packages/$p version $v"; exit 1; }
          done
      - run: bun run --filter './packages/*' build
      - name: Stage publish
        run: |
          for p in client server cli; do
            (cd packages/$p && npm stage publish --access public --provenance)
          done
