name: Build images

# Builds the server, admin portal and docs images and pushes them to GHCR,
# so a deployment only pulls finished images (deploy/docker-compose.ghcr.yml).
#
# Tags: `latest` for main, plus the commit SHA. Optional: set the repository
# secret DEPLOY_WEBHOOK_URL to a URL your host exposes to trigger a redeploy.
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: au1h-server
            dockerfile: apps/server/Dockerfile
          - name: au1h-web
            dockerfile: apps/web/Dockerfile
          - name: au1h-docs
            dockerfile: apps/docs/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          # repository owner is lower-cased for GHCR
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  redeploy:
    needs: build
    runs-on: ubuntu-latest
    if: ${{ always() && needs.build.result == 'success' }}
    steps:
      - name: Trigger deploy webhook
        env:
          URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
        run: |
          if [ -z "$URL" ]; then echo "DEPLOY_WEBHOOK_URL not set; skipping"; exit 0; fi
          curl -fsS -X POST "$URL"
