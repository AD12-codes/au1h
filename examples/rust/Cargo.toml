[package]
name = "au1h-example-rust"
version = "0.1.0"
edition = "2021"
description = "au1h example backend: axum + jsonwebtoken"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
jsonwebtoken = "9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
