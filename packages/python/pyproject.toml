[project]
name = "au1h"
version = "0.1.1"
description = "Verify au1h tokens and read au1h gateway headers. FastAPI helpers included."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["pyjwt[crypto]>=2.9"]

[project.urls]
Homepage = "https://github.com/AD12-codes/au1h"
Documentation = "https://github.com/AD12-codes/au1h/tree/main/apps/docs"
Source = "https://github.com/AD12-codes/au1h"

[project.optional-dependencies]
fastapi = ["fastapi>=0.110"]
httpx = ["httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["au1h"]
